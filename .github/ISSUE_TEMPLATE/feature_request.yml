name: Feature request
description: Suggest something OpenCouncil should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/ROADMAP.md](https://github.com/Zeyad-Gomaa/OpenCouncil/blob/main/docs/ROADMAP.md)
        first — it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in, not only the feature you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
