name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Deliberately excludes apps/server/dist/public: that subtree is Next.js
      # output minified by @next/swc, a per-platform native binary, so a Linux
      # runner cannot reproduce byte-for-byte what a maintainer built on macOS.
      # The esbuild bundle and tsc declarations are deterministic across
      # platforms, and they are what goes stale when src is edited.
      - name: Committed server bundle is up to date
        run: |
          set -euo pipefail
          PATHS="apps/server/dist/cli.js apps/server/dist/index.js packages/shared/dist"
          if ! git diff --quiet -- $PATHS; then
            echo "::error::Committed build output is stale — run 'npm run build' and commit the result."
            git diff --stat -- $PATHS
            git diff -- $PATHS | head -100
            exit 1
          fi
      - name: Package smoke test
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TGZ" >/dev/null
          test "$(./node_modules/.bin/opencouncil --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          ./node_modules/.bin/opencouncil --help >/dev/null
          test -f node_modules/opencouncil/apps/server/dist/public/index.html
